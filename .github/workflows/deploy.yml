name: Deploy

on:
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Never cancel a running deploy: CloudFormation can be left stuck halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      # Pinned to commits: this job has AWS access, and a tag can be moved.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: CDK deploy
        run: npx cdk deploy FoodlyStack --require-approval never

      - name: Start the frontend build
        run: |
          curl --fail --silent --show-error -X POST \
            -H 'Content-Type: application/json' -d '{}' "$AMPLIFY_WEBHOOK_URL"
        env:
          AMPLIFY_WEBHOOK_URL: ${{ secrets.AMPLIFY_WEBHOOK_URL }}
