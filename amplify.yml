version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install --skip-default-packages
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # The commit as the Sentry release (read by @sentry/vite-plugin). Not AWS_COMMIT_ID: it is
        # "HEAD" for webhook-started builds like ours (aws-amplify/amplify-hosting#3447).
        - SENTRY_RELEASE=$(git rev-parse HEAD) npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
